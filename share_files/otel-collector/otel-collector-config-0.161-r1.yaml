# DT-3549 — ECS OTel collector proxy configuration
#
# Paired with: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.x
#
# Published files are immutable: tasks fetch this URL on every start, so editing it
# in place hits every leaf that points here. Changes go to a new -rN file; a new
# collector minor starts a new -<minor>-r1 file.
receivers:
  otlp/ecs-otel:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/ecs:
    config:
      scrape_configs:
      - job_name: opentelemetry-collector-proxy
        scrape_interval: 10s
        static_configs:
          - targets:
              - ${env:HOSTNAME}:8888

exporters:
  debug:
    verbosity: ${env:otel_conf_debug_verbosity}
  load_balancing/trace:
    protocol:
      otlp:
        timeout: 1s
        tls:
          insecure: true
    resolver:
      static:
        # passthrough:/// hands the name to Go's dialer, which falls back to IPv4
        # silently. With gRPC's default dns resolver, the IPv6 address Service Connect
        # lists for these names is dialled too and fails with "network is unreachable"
        # (IPv4-only tasks), logging a warn on every reconnect.
        hostnames:
        - passthrough:///otel-collector-trace-0.otel-collector.local:4317
        - passthrough:///otel-collector-trace-1.otel-collector.local:4317
    routing_key: traceID
  otlp_http/cent-monitor:
    endpoint: "https://cent-otel.ops.splashtop.com:443"
    sending_queue:
      queue_size: ${env:otel_conf_cent_queue_size:-200}
    retry_on_failure:
      max_elapsed_time: ${env:otel_conf_cent_retry_max:-300}s
  otlp_http/tperd-monitor:
    endpoint: "https://cent-otel-devops.ops.tperd.splashtop.eu:443"
    sending_queue:
      queue_size: ${env:otel_conf_tperd_queue_size:-200}
    retry_on_failure:
      max_elapsed_time: ${env:otel_conf_tperd_retry_max:-300}s

processors:
  batch: {}
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - key: "splashtop.env"
        value: ${env:splashtop_env}
        action: "insert"
      - key: "splashtop.stack"
        value: ${env:splashtop_stack}
        action: "insert"
  # add attribute to data from self
  resource/self-metrics:
    attributes:
      - key: "splashtop.datacenter"
        value: ${env:ecs_cluster_name}
        action: "insert"
      - key: "splashtop.region"
        value: ${env:ecs_region}
        action: "insert"

connectors:
  # routing rules:
  # 1. DEV -> tperd-monitor & cent-monitor (for load testing)
  # 2. QA-EU -> both tperd-monitor & cent-monitor
  # 3. OTHERS (incl. PROD-OC) -> cent-monitor
  # DT-3358: PROD-OC removed from tperd dual-write; TPE test stack could not
  # keep up with real PROD volume, causing chronic 100% queue saturation.
  routing/traces:
    error_mode: ignore
    table:
      - context: span
        statement: route() where IsMatch(resource.attributes["splashtop.env"], "PROD") and IsMatch(resource.attributes["splashtop.stack"], "OC")
        pipelines: [traces/cent-monitor]
      - context: span
        statement: route() where IsMatch(resource.attributes["splashtop.env"], "QA") and IsMatch(resource.attributes["splashtop.stack"], "EU")
        pipelines: [traces/multi-exporters]
      - context: span
        statement: route() where IsMatch(resource.attributes["splashtop.env"], "DEV")
        pipelines: [traces/multi-exporters]
      - context: span
        statement: route()
        pipelines: [traces/cent-monitor]
  routing/metrics:
    error_mode: ignore
    table:
      - context: metric
        statement: route() where IsMatch(resource.attributes["splashtop.env"], "PROD") and IsMatch(resource.attributes["splashtop.stack"], "OC")
        pipelines: [metrics/cent-monitor]
      - context: metric
        statement: route() where IsMatch(resource.attributes["splashtop.env"], "QA") and IsMatch(resource.attributes["splashtop.stack"], "EU")
        pipelines: [metrics/multi-exporters]
      - context: metric
        statement: route() where IsMatch(resource.attributes["splashtop.env"], "DEV")
        pipelines: [metrics/multi-exporters]
      - context: metric
        statement: route()
        pipelines: [metrics/cent-monitor]
  routing/logs:
    error_mode: ignore
    table:
      - context: log
        statement: route() where IsMatch(resource.attributes["splashtop.env"], "PROD") and IsMatch(resource.attributes["splashtop.stack"], "OC")
        pipelines: [logs/cent-monitor]
      - context: log
        statement: route() where IsMatch(resource.attributes["splashtop.env"], "QA") and IsMatch(resource.attributes["splashtop.stack"], "EU")
        pipelines: [logs/multi-exporters]
      - context: log
        statement: route() where IsMatch(resource.attributes["splashtop.env"], "DEV")
        pipelines: [logs/multi-exporters]
      - context: log
        statement: route()
        pipelines: [logs/cent-monitor]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  telemetry:
    # otelcol >= 0.149 only puts service.name on target_info, defaulting to
    # "otelcol-contrib"; the self-scrape (prometheus/ecs) then takes it as
    # service.name, which becomes the job label in Mimir. Pin it to the
    # scrape job_name so the job label stays opentelemetry-collector-proxy.
    resource:
      attributes:
        - name: service.name
          value: opentelemetry-collector-proxy
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:HOSTNAME}
                port: 8888
  extensions:
    - health_check
  pipelines:
    traces:
      receivers: [otlp/ecs-otel]
      processors: [memory_limiter, resource, batch]
      exporters: [routing/traces]
    traces/tperd-monitor:
      receivers: [routing/traces]
      processors: [memory_limiter, batch]
      exporters: [load_balancing/trace, debug]
    traces/cent-monitor:
      receivers: [routing/traces]
      processors: [memory_limiter, batch]
      exporters: [load_balancing/trace, debug]
    traces/multi-exporters:
      receivers: [routing/traces]
      processors: [memory_limiter, batch]
      exporters: [load_balancing/trace, debug]
    metrics:
      receivers: [otlp/ecs-otel]
      processors: [memory_limiter, resource, batch]
      exporters: [routing/metrics]
    metrics/self-metrics:
      receivers: [prometheus/ecs]
      processors: [memory_limiter, resource, resource/self-metrics, batch]
      exporters: [routing/metrics]
    metrics/tperd-monitor:
      receivers: [routing/metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tperd-monitor, debug]
    metrics/cent-monitor:
      receivers: [routing/metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/cent-monitor, debug]
    metrics/multi-exporters:
      receivers: [routing/metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/cent-monitor, otlp_http/tperd-monitor, debug]
    logs:
      receivers: [otlp/ecs-otel]
      processors: [memory_limiter, resource, batch]
      exporters: [routing/logs]
    logs/tperd-monitor:
      receivers: [routing/logs]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tperd-monitor, debug]
    logs/cent-monitor:
      receivers: [routing/logs]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/cent-monitor, debug]
    logs/multi-exporters:
      receivers: [routing/logs]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/cent-monitor, otlp_http/tperd-monitor, debug]
