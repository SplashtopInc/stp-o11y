# DT-3571 — OTel collector on the Spluki control-plane EC2 host
#
# Paired with: otelcol-contrib 0.161.x (linux arm64 RPM, systemd) on Amazon Linux 2023.
# Sends host metrics + the Spluki app log over PrivateLink (interface endpoint in
# stp-vpc-spluki-usw2) to the Spluki ECS OTel proxy, which adds
# splashtop.env=DEV / splashtop.stack=SPLUKI and forwards to Cent.
#
# Required environment (see README.md):
#   SPLUKI_OTEL_ENDPOINT  http://<interface endpoint DNS>:4318 (plain HTTP — the
#                         proxy NLB listens on TCP 4318, PrivateLink keeps it private)
#   GOMEMLIMIT            soft Go heap limit, below the systemd MemoryMax
# Must run as root: it reads the app log under /home/ec2-user (mode 0700).
#
# Published files are immutable: hosts fetch this URL on every start, so editing it
# in place hits every host that points here. Changes go to a new -rN file; a new
# collector minor starts a new -<minor>-r1 file.

extensions:
  # Keeps the app-log read position across collector restarts, so a restart
  # neither re-sends nor skips lines.
  file_storage:
    directory: /var/lib/otelcol-contrib/file_storage
    create_directory: true

receivers:
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      paging: {}
      disk: {}
      network: {}
      processes: {}
      filesystem:
        exclude_fs_types:
          match_type: strict
          fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tracefs, tmpfs]

  # The app's own log: spluki.logging_config writes it through a RotatingFileHandler
  # (1 MB x 30) under the unit's WorkingDirectory, one line per record:
  #   <asctime> level=<LEVEL> logger=<name> request_id=<id> <message with key=value tokens>
  # Lines are shipped as-is (fields are parsed at query time, e.g. LogQL `| logfmt`).
  # The only processing is joining a traceback's lines to the record they belong to:
  # a record starts at a timestamp.
  file_log/spluki:
    include:
      - /home/ec2-user/work/Spluki/web-service/backend/storage/logs/spluki.log*
    start_at: end
    storage: file_storage
    multiline:
      line_start_pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} '

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 200
    spike_limit_mib: 50
  batch: {}
  resource_detection:
    detectors: [env, ec2, system]
    system:
      hostname_sources: [os]
  resource:
    attributes:
      - key: service.name
        value: spluki
        action: insert

exporters:
  otlp_http/spluki-proxy:
    endpoint: ${env:SPLUKI_OTEL_ENDPOINT}
    sending_queue:
      queue_size: 200
    retry_on_failure:
      max_elapsed_time: 300s

service:
  extensions: [file_storage]
  telemetry:
    logs:
      level: info
    # No self-metrics endpoint on the host (nothing scrapes it).
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [host_metrics]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [otlp_http/spluki-proxy]
    logs:
      receivers: [file_log/spluki]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [otlp_http/spluki-proxy]
