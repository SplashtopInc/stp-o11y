receivers:
  prometheus/custom-job:
    config:
      scrape_configs:
      - job_name: ${env:scrape_job_name:-default-job}
        scrape_interval: 10s
        static_configs:
          - targets: ["${env:scrape_job_target:-127.0.0.1:8080}"]

service:
  pipelines:
    metrics/custom-job:
      receivers: [prometheus/custom-job]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/ecs-otel]