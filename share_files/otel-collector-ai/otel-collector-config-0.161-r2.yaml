# DT-3242 — AI OTel Collector configuration (ECS Fargate)
# DT-3549 — moved to the versioned layout for otelcol 0.161
# DT-3692 — r2: the collector in the Cent admin VPC of aws-monitoring sends to the
#           Cent OTel collector (internal NLB) instead of Mimir/Loki through
#           PrivateLink. Everything else is r1.
#
# Deployed by: stp-devops-k8s-observability/stacks/ai-otel/monitoring/usw2/
#              (ocstack/usw2 stays on r1 until it retires)
# Paired with: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.x
#
# Published files are immutable: tasks fetch this URL on every start, so editing it
# in place hits every task that points here. Changes go to a new -rN file; a new
# collector minor starts a new -<minor>-r1 file.
#
# Auth model: bearer token, per-scope. The `tokens:` list lets the server accept
# EITHER the current OR the previous slot value so rotations can flip the UI to
# a new token without a tight cutover. Slots are rotated via
# scripts/rotate-token.sh in the Terraform module.
#
# Per-scope routing (see knowledge-otel-collector-ai.md):
#   - code   :4319 → Claude Code SDK: metrics + logs + traces
#   - cowork :4318 → Cowork (claude.ai): logs only by design (no metrics, no traces)
#
# Traces: Tempo PrivateLink is out of DT-3242 scope. Code-line traces go to the
# `debug` exporter so the data flow is observable until Phase 5 wires Tempo.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

  bearertokenauth/code:
    scheme: Bearer
    tokens:
      - ${env:CODE_TOKEN_CURRENT}
      - ${env:CODE_TOKEN_PREVIOUS}

  bearertokenauth/cowork:
    scheme: Bearer
    tokens:
      - ${env:COWORK_TOKEN_CURRENT}
      - ${env:COWORK_TOKEN_PREVIOUS}

receivers:
  otlp/code:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        include_metadata: true
        auth:
          authenticator: bearertokenauth/code

  otlp/cowork:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
        auth:
          authenticator: bearertokenauth/cowork

  # Self-metrics (scrape collector's own /metrics endpoint)
  prometheus/self:
    config:
      scrape_configs:
        - job_name: ai-otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch: {}

  # ECS task metadata → resource attributes (aws.ecs.tasks.ecs.cluster.arn, etc.)
  resource_detection/ecs:
    detectors: [ecs]
    timeout: 2s
    override: false

  # Splashtop env/stack tags applied to all upstream signals
  resource:
    attributes:
      - key: splashtop.env
        value: ${env:splashtop_env}
        action: insert
      - key: splashtop.stack
        value: ${env:splashtop_stack}
        action: insert

  # Extra tags for self-metrics so they're distinguishable from upstream data
  resource/self-metrics:
    attributes:
      - key: splashtop.datacenter
        value: ${env:ecs_cluster_name}
        action: insert
      - key: splashtop.region
        value: ${env:ecs_region}
        action: insert

  attributes/inject_client_ip:
    actions:
      - key: client.address
        from_context: X-Forwarded-For
        action: insert

exporters:
  debug:
    verbosity: ${env:otel_conf_debug_verbosity}

  # The Cent OTel collector picks the tenant from splashtop.env, which the
  # resource processor sets from the task env: QA -> Mimir/Loki tenant 2, the
  # same tenant r1 wrote to with X-Scope-OrgID. Data without splashtop.env has no
  # route there and is dropped, so the resource processor must stay on every
  # pipeline that exports here.
  otlp_http/cent:
    endpoint: http://cent-otel-int.ops.aws-monitoring.splashtop.com:4318
    compression: gzip

service:
  telemetry:
    # service.namespace + service.name become the Mimir job label
    # ("splashtop.observability/ai-otel-collector"); keep both.
    resource:
      attributes:
        - name: service.name
          value: ai-otel-collector
        - name: service.namespace
          value: splashtop.observability
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888

  extensions:
    - health_check
    - bearertokenauth/code
    - bearertokenauth/cowork

  pipelines:
    # Claude Code SDK — full triad
    metrics/code:
      receivers: [otlp/code]
      processors: [memory_limiter, resource_detection/ecs, resource, batch]
      exporters: [otlp_http/cent]
    logs/code:
      receivers: [otlp/code]
      processors: [memory_limiter, resource_detection/ecs, resource, attributes/inject_client_ip, batch]
      exporters: [otlp_http/cent]
    traces/code:
      receivers: [otlp/code]
      processors: [memory_limiter, resource_detection/ecs, resource, batch]
      exporters: [debug]

    # Cowork — logs only
    logs/cowork:
      receivers: [otlp/cowork]
      processors: [memory_limiter, resource_detection/ecs, resource, attributes/inject_client_ip, batch]
      exporters: [otlp_http/cent]

    # Self-metrics → Mimir with same org-id (separate processors to inject collector-specific tags)
    metrics/self:
      receivers: [prometheus/self]
      processors: [memory_limiter, resource_detection/ecs, resource, resource/self-metrics, batch]
      exporters: [otlp_http/cent]
